[library]
name = "@lam/protobuf"
version = "2.0.0"
description = "Protocol Buffers wire-format codec for Lammergeier"
license = "Apache-2.0"
authors = ["Lammergeier contributors"]
repository = "https://github.com/thallium-solutions/lam-protobuf"
homepage = "https://github.com/thallium-solutions/lam-protobuf"

[compatibility]
lamc = "^1.18"

[go-deps]
"google.golang.org/protobuf" = "v1.36.11"

[scripts]
test = "python3 tests/run_protobuf_tests.py --verbose"
format = "lamc fmt ."
